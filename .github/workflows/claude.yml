name: Claude

# Interactive assistant: mention @claude in an issue, PR, or review comment and
# Claude responds in-thread — answering questions, implementing requested
# changes, and pushing commits to the PR branch when asked.
#
# Setup required (one-time):
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Add repo secret ANTHROPIC_API_KEY (Settings -> Secrets -> Actions).
# See https://github.com/anthropics/claude-code-action for full docs.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Only run when @claude is actually mentioned (or an issue is assigned to claude),
# so we never burn a run on unrelated comments.
jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read       # let Claude read CI results on the PR
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Allow Claude to run the repo's build/test tooling when fulfilling a
          # request. Tighten or widen as you see fit.
          claude_args: '--allowedTools "Bash(pnpm install),Bash(pnpm -r build),Bash(pnpm -r test),Bash(pnpm -r typecheck),Bash(git*)"'
